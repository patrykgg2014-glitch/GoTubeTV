
name: Rozpakuj GoTubeTV

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Rozpakuj projekt
        run: |
          ZIP=$(find . -maxdepth 1 -iname "*.zip" -print -quit)
          if [ -z "$ZIP" ]; then
            echo "Nie znaleziono pliku ZIP"
            exit 1
          fi
          mkdir -p /tmp/gotubetv
          unzip -o "$ZIP" -d /tmp/gotubetv
          PROJECT=$(find /tmp/gotubetv -name package.json -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "Nie znaleziono package.json"
            exit 1
          fi
          cp -R "$(dirname "$PROJECT")"/. .

      - name: Zapisz pliki w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Dodaj pliki GoTubeTV"
            git push
          fi
